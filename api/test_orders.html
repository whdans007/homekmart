<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            background: white;
            padding: 15px;
            margin-top: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            border-left: 4px solid #28a745;
        }
        .error {
            border-left: 4px solid #dc3545;
        }
    </style>
</head>
<body>
    <h1>📦 Order API Test</h1>
    <p>필리핀 배달 앱 주문 API 테스트</p>

    <!-- 1. 주문 생성 -->
    <div class="test-section">
        <h2>1. Create Order (장바구니 → 주문 생성)</h2>
        <p>사전 조건: 장바구니에 상품이 있어야 함</p>
        <button onclick="testCreateOrder()">주문 생성</button>
        <div id="createOrderResult" class="result"></div>
    </div>

    <!-- 2. 주문 목록 조회 -->
    <div class="test-section">
        <h2>2. List Orders (주문 목록 조회)</h2>
        <button onclick="testListOrders()">전체 주문 조회</button>
        <button onclick="testListOrdersByStatus('pending')">대기 중 주문</button>
        <button onclick="testListOrdersByStatus('cancelled')">취소된 주문</button>
        <div id="listOrdersResult" class="result"></div>
    </div>

    <!-- 3. 주문 상세 조회 -->
    <div class="test-section">
        <h2>3. Order Detail (주문 상세 조회)</h2>
        <input type="number" id="detailOrderId" placeholder="Order ID" value="1" style="padding: 8px; margin-right: 10px;">
        <button onclick="testOrderDetail()">상세 조회</button>
        <div id="orderDetailResult" class="result"></div>
    </div>

    <!-- 4. 주문 추적 -->
    <div class="test-section">
        <h2>4. Order Tracking (주문 배송 추적)</h2>
        <input type="number" id="trackingOrderId" placeholder="Order ID" value="1" style="padding: 8px; margin-right: 10px;">
        <button onclick="testOrderTracking()">배송 추적</button>
        <div id="trackingResult" class="result"></div>
    </div>

    <!-- 5. 주문 취소 -->
    <div class="test-section">
        <h2>5. Cancel Order (주문 취소)</h2>
        <input type="number" id="cancelOrderId" placeholder="Order ID" value="1" style="padding: 8px; margin-right: 10px;">
        <button onclick="testCancelOrder()">주문 취소</button>
        <div id="cancelOrderResult" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'https://192-168-1-123.philsarang.direct.quickconnect.to/homekmart/api';
        const USER_ID = 13;
        const DELIVERY_ADDRESS_ID = 1;

        function displayResult(elementId, data, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = isSuccess ? 'result success' : 'result error';
        }

        async function testCreateOrder() {
            try {
                const response = await fetch(`${BASE_URL}/orders/create.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        delivery_address_id: DELIVERY_ADDRESS_ID,
                        payment_method: 'cod',
                        cod_amount: 100,
                        special_instructions: 'Please ring the doorbell'
                    })
                });
                const data = await response.json();
                displayResult('createOrderResult', data, response.ok);
            } catch (error) {
                displayResult('createOrderResult', { error: error.message }, false);
            }
        }

        async function testListOrders() {
            try {
                const response = await fetch(`${BASE_URL}/orders/list.php?user_id=${USER_ID}`);
                const data = await response.json();
                displayResult('listOrdersResult', data, response.ok);
            } catch (error) {
                displayResult('listOrdersResult', { error: error.message }, false);
            }
        }

        async function testListOrdersByStatus(status) {
            try {
                const response = await fetch(`${BASE_URL}/orders/list.php?user_id=${USER_ID}&status=${status}`);
                const data = await response.json();
                displayResult('listOrdersResult', data, response.ok);
            } catch (error) {
                displayResult('listOrdersResult', { error: error.message }, false);
            }
        }

        async function testOrderDetail() {
            try {
                const orderId = document.getElementById('detailOrderId').value;
                const response = await fetch(`${BASE_URL}/orders/detail.php?order_id=${orderId}&user_id=${USER_ID}`);
                const data = await response.json();
                displayResult('orderDetailResult', data, response.ok);
            } catch (error) {
                displayResult('orderDetailResult', { error: error.message }, false);
            }
        }

        async function testOrderTracking() {
            try {
                const orderId = document.getElementById('trackingOrderId').value;
                const response = await fetch(`${BASE_URL}/orders/tracking.php?order_id=${orderId}&user_id=${USER_ID}`);
                const data = await response.json();
                displayResult('trackingResult', data, response.ok);
            } catch (error) {
                displayResult('trackingResult', { error: error.message }, false);
            }
        }

        async function testCancelOrder() {
            try {
                const orderId = document.getElementById('cancelOrderId').value;
                const response = await fetch(`${BASE_URL}/orders/cancel.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        order_id: parseInt(orderId),
                        user_id: USER_ID,
                        cancellation_reason: 'Changed my mind'
                    })
                });
                const data = await response.json();
                displayResult('cancelOrderResult', data, response.ok);
            } catch (error) {
                displayResult('cancelOrderResult', { error: error.message }, false);
            }
        }
    </script>
</body>
</html>
