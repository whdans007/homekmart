<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 Vue 테스트</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Vue.js 테스트</h1>
        
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-lg font-semibold mb-2">상태</h2>
            <p>Vue 앱 실행: <span class="text-green-600">{{ vueWorking ? '성공' : '실패' }}</span></p>
            <p>카테고리 수: {{ categories.length }}</p>
            <p>현재 시간: {{ currentTime }}</p>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow mb-4">
            <h2 class="text-lg font-semibold mb-2">카테고리</h2>
            <div v-if="categories.length === 0" class="text-gray-500">
                카테고리를 불러오는 중...
            </div>
            <div v-else class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div v-for="category in categories" :key="category.id" 
                     class="bg-blue-100 p-3 rounded-lg text-center">
                    <i :class="category.icon_class || 'fas fa-tag'" class="text-2xl text-blue-600 mb-2"></i>
                    <p class="font-medium">{{ category.name }}</p>
                </div>
            </div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2">API 테스트</h2>
            <button @click="testAPI" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                API 테스트
            </button>
            <div v-if="apiResult" class="mt-2 p-2 bg-gray-100 rounded">
                <pre>{{ apiResult }}</pre>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    vueWorking: true,
                    categories: [],
                    currentTime: '',
                    apiResult: null
                }
            },
            
            methods: {
                async testAPI() {
                    try {
                        console.log('API 테스트 시작');
                        const response = await fetch('/homekmart/shop/api/categories_simple.php');
                        console.log('Response 받음:', response.status);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        
                        const data = await response.json();
                        console.log('데이터:', data);
                        
                        this.apiResult = JSON.stringify(data, null, 2);
                        
                        if (data.categories) {
                            this.categories = data.categories;
                        }
                    } catch (error) {
                        console.error('API 테스트 실패:', error);
                        this.apiResult = `오류: ${error.message}`;
                    }
                },
                
                updateTime() {
                    this.currentTime = new Date().toLocaleString('ko-KR');
                }
            },
            
            mounted() {
                console.log('간단한 Vue 앱 시작');
                this.updateTime();
                setInterval(this.updateTime, 1000);
                
                // 자동으로 API 테스트
                this.testAPI();
            }
        }).mount('#app');
    </script>
</body>
</html>
